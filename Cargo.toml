[workspace]
resolver = "2"
members = [
    "crates/neowon-core",
    "crates/neowon-backend",
    "crates/neowon-dsp",
    "crates/neowon-sim",
    "crates/neowon-sdr",
    "crates/neowon-catalog",
    "crates/neowon-refdb",
    "crates/neowon-audio",
    "crates/neowon-vds1022",
    "crates/neowon-cli",
    "crates/neowon-app",
    "crates/neowon-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
neowon-core = { path = "crates/neowon-core" }
neowon-backend = { path = "crates/neowon-backend" }
neowon-dsp = { path = "crates/neowon-dsp" }
neowon-sim = { path = "crates/neowon-sim" }
neowon-sdr = { path = "crates/neowon-sdr" }
neowon-catalog = { path = "crates/neowon-catalog" }
neowon-refdb = { path = "crates/neowon-refdb" }
neowon-audio = { path = "crates/neowon-audio" }
neowon-vds1022 = { path = "crates/neowon-vds1022" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive", "env"] }
nusb = "0.2"
zstd = "0.13"
# Phase 10 D4: the catalog's file format. Already in the tree via neowon-mcp.
serde = { version = "1.0.229", features = ["derive"] }
# Phase 10.14 D19: blocking HTTPS for the reference fetchers, rustls and
# confined to neowon-refdb::fetch.
ureq = "3"
# float_roundtrip: catalog f64 fields must survive JSON field-exact.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# Pinned to the version already compiled in Bevy's tree (see Cargo.lock).
png = "0.18"

bevy = "=0.19.1"
bevy_egui = "0.41"

# Fast dev builds: light optimization for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The "*" wildcard does not cover workspace members; list hot ones explicitly.
[profile.dev.package.neowon-dsp]
opt-level = 3

[profile.dev.package.neowon-vds1022]
opt-level = 3
