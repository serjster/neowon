[package]
name = "neowon-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neowon-app"
path = "src/main.rs"

[dependencies]
neowon-core.workspace = true
neowon-codec.workspace = true
neowon-dsp.workspace = true
neowon-sim.workspace = true
neowon-sdr.workspace = true
neowon-catalog.workspace = true
neowon-refdb.workspace = true
neowon-audio.workspace = true
neowon-backend.workspace = true
neowon-vds1022.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
bytemuck = "1"
crossbeam-channel.workspace = true
png.workspace = true
tracing.workspace = true

# D31: a `NEOWON_NO_INPUT` app hands activation back (src/hostinput/macos.rs).
# Operator-approved 2026-09-23. Pinned to the 0.3.2 already in the tree via
# bevy_egui (arboard, webbrowser), with only features it already enables.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
